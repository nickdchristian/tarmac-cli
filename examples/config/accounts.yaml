# Member accounts. Tarmac creates each one, moves it to its OU and applies its baseline.
#
# - Budget and anomaly alerts accept 1 to 10 emails. Use shared team mailboxes, such as
#   finops-alerts@company.com, so alerts still reach someone when people leave.
# - Tags: top-level `tags:` apply to every account, and an account's own `tags:` add to or override them.
#   They also go on the stacks tarmac deploys for the account.

accounts:
  # ---------------------------------------------------------------------------
  # Core Infrastructure Accounts
  # ---------------------------------------------------------------------------
  - name: "deployment"
    email: "aws-deployment@example.com"
    ou: "Deployments"
    tags:
      Environment: "Infrastructure"
      Purpose: "CI/CD and Terraform State Backend"
      ManagedBy: "tarmac"
    baseline:
      delete_default_vpc: true
      budget:
        monthly_limit_usd: 50.0
        alert_threshold_percent: 80.0
        # forecast_alert_threshold_percent: 100.0   # default; also alert on forecasted spend (AWS needs ~5 weeks of history). null turns it off
        notification_emails: ["aws-deployment@example.com"]

  - name: "network-central"
    email: "aws-network@example.com"
    ou: "Infrastructure"
    tags:
      Environment: "Infrastructure"
      Purpose: "Transit Gateway and Centralized VPC Routing"
      ManagedBy: "tarmac"
    baseline:
      delete_default_vpc: true
      budget:
        monthly_limit_usd: 50.0
        alert_threshold_percent: 85.0
        notification_emails: ["aws-network@example.com"]

  # ---------------------------------------------------------------------------
  # Security Accounts
  # ---------------------------------------------------------------------------
  - name: "log-archive"
    email: "aws-log-archive@example.com"
    ou: "Security"
    tags:
      Environment: "Security"
      Purpose: "Centralized Immutable CloudTrail and Config Logs"
      ManagedBy: "tarmac"
    baseline:
      delete_default_vpc: true
      budget:
        monthly_limit_usd: 50.0
        alert_threshold_percent: 80.0
        notification_emails: ["aws-log-archive@example.com"]

  - name: "audit"
    email: "aws-audit@example.com"
    ou: "Security"
    tags:
      Environment: "Security"
      Purpose: "Security Auditing - Config Aggregator - Alerts"
      ManagedBy: "tarmac"
    baseline:
      delete_default_vpc: true
      budget:
        monthly_limit_usd: 250.0
        alert_threshold_percent: 80.0
        notification_emails: ["finops-alerts@example.com", "security-operations@example.com"]

  # ---------------------------------------------------------------------------
  # Workload Accounts
  # ---------------------------------------------------------------------------
  - name: "prod-app"
    email: "aws-prod@example.com"
    ou: "Prod"
    tags:
      Environment: "Production"
      Workload: "Core"
      ManagedBy: "tarmac"
    baseline:
      delete_default_vpc: true
      budget:
        monthly_limit_usd: 50.0
        alert_threshold_percent: 80.0
        notification_emails: ["aws-prod@example.com"]
      anomaly_detection:
        enabled: true
        threshold_usd: 100.0
        notification_emails: ["aws-prod@example.com"]

  - name: "stage-app"
    email: "aws-stage@example.com"
    ou: "Test"
    tags:
      Environment: "Stage"
      Workload: "Core"
      ManagedBy: "tarmac"
    baseline:
      delete_default_vpc: true
      budget:
        monthly_limit_usd: 50.0
        alert_threshold_percent: 80.0
        notification_emails: ["aws-stage@example.com"]

  - name: "dev-app"
    email: "aws-dev@example.com"
    ou: "Test"
    tags:
      Environment: "Development"
      Workload: "Core"
      ManagedBy: "tarmac"
    baseline:
      delete_default_vpc: true
      budget:
        monthly_limit_usd: 50.0
        alert_threshold_percent: 85.0
        notification_emails: ["aws-dev@example.com"]
