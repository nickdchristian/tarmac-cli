# =============================================================================
# AWS Governance: Management account root activity alert
# =============================================================================
# The deny-root SCP does not apply to the management account, so root use there is
# only visible, not blocked. This stack emails (and optionally posts to a webhook)
# whenever the root user signs in or makes an API call in this account.
#
# Deploy it in us-east-1 (AWS records root sign-in events there) and in your
# primary Region; tarmac deploys it to both, and to every declared Region when
# security_services.root_alert.all_regions is true. Cost: EventBridge ingests AWS
# management events for free and a handful of SNS emails costs next to nothing.
# =============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: Alert on root user activity in the management account

Parameters:
  OrgName:
    Type: String
    Description: Organization name prefix for resource naming

  AlertEmail:
    Type: String
    Default: ''
    Description: Email address for root activity alerts

  IncidentResponseWebhookUrl:
    Type: String
    Default: ''
    Description: (Optional) HTTPS webhook URL for security incident response / SIEM
    AllowedPattern: '^(https://.*)?$'

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasWebhookEndpoint: !Not [!Equals [!Ref IncidentResponseWebhookUrl, '']]

Resources:
  RootAlertTopic:
    Type: AWS::SNS::Topic
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_26
            comment: "EventBridge cannot publish to a topic encrypted with the AWS-managed SNS key, and a customer managed key would add a monthly charge for a topic that carries only the root sign-in event."
    Properties:
      TopicName: !Sub '${OrgName}-management-root-alerts'
      Tags:
        - Key: Purpose
          Value: Management account root activity alerts

  RootAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref RootAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootActivityRuleToPublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref RootAlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${OrgName}-management-root-activity'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sns:Publish
            Resource: !Ref RootAlertTopic
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  RootAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref RootAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  RootAlertWebhookSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasWebhookEndpoint
    Properties:
      TopicArn: !Ref RootAlertTopic
      Protocol: https
      Endpoint: !Ref IncidentResponseWebhookUrl

  RootActivityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${OrgName}-management-root-activity'
      Description: Alert when the root user signs in or calls an API in the management account
      EventPattern:
        detail-type:
          - AWS Console Sign In via CloudTrail
          - AWS API Call via CloudTrail
        detail:
          userIdentity:
            type:
              - Root
      Targets:
        - Arn: !Ref RootAlertTopic
          Id: RootActivitySNS

Outputs:
  RootAlertTopicArn:
    Description: SNS topic that receives management account root activity alerts
    Value: !Ref RootAlertTopic
