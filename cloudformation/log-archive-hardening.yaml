# =============================================================================
# AWS Governance: Log Archive Account Hardening Reference Template
# =============================================================================
# Architecture & Security Design Note:
# -----------------------------------------------------------------------------
# 1. Separation of Duties (KMS Key Policy):
#    AWS's default KMS policy (kms:*) delegates all key actions to IAM.
#    This template narrows that:
#    - Key management: the account root principal is granted key management
#      actions (rotation, tags, lifecycle) without kms:Encrypt or kms:Decrypt.
#    - Reading logs: the same root principal is granted kms:Decrypt and
#      kms:DescribeKey, which delegates to IAM. Any identity in this account whose
#      IAM policy allows kms:Decrypt can read the logs; there is no separate
#      auditor principal in the key policy. Grant that permission only to your
#      auditor roles.
#    - Writing logs: the cloudtrail.amazonaws.com and config.amazonaws.com
#      service principals are granted kms:GenerateDataKey (and Decrypt,
#      DescribeKey) guarded by 'aws:SourceOrgID'. S3 server access logs are
#      written to a separate bucket and are not encrypted with this key.
#    This is a guardrail, not a hard separation: kms:Put* includes PutKeyPolicy, so
#    an identity allowed to manage this key can rewrite the policy.
#
# 2. Centralized S3 Log Storage (AWS Security Reference Architecture - SRA):
#    - 'OrganizationCloudTrailBucket': Centralized organizational log repository
#      encrypted with 'LogArchiveKmsKey' and protected by an explicit bucket policy.
#    - 'AccessLogsBucket': Dedicated target for S3 Server Access Logs to track
#      who accesses the audit buckets while preventing recursive logging loops.
# =============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: Log Archive account hardening — KMS key, centralized CloudTrail bucket, access logging, and lifecycle policies

Parameters:
  OrganizationId:
    Type: String
    Description: AWS Organization ID (e.g., o-xxxxx)
    AllowedPattern: '^o-[a-z0-9]{10,32}$'

  OrgName:
    Type: String
    Description: Organization name prefix for resource naming

  EnableKmsEncryption:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Encrypt the CloudTrail log bucket with a customer managed KMS key. Set to 'false' to use SSE-S3 (AES256)
      and skip the key and its request charges. An existing key is retained when switching to 'false' because
      logs written earlier still need it to be read.

  LogRetentionDays:
    Type: String
    Default: '0'
    AllowedPattern: '^[0-9]{1,5}$'
    Description: >-
      Delete CloudTrail log files this many days after they are written. '0' keeps them indefinitely.
      Deleted versions are purged 7 days later. Choose a value that satisfies your audit and compliance
      requirements; logs cannot be recovered once purged.

Conditions:
  UseKmsEncryption: !Equals [!Ref EnableKmsEncryption, 'true']
  HasLogRetention: !Not [!Equals [!Ref LogRetentionDays, '0']]

Resources:
  LogArchiveKmsKey:
    Type: AWS::KMS::Key
    Condition: UseKmsEncryption
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts Log Archive S3 buckets
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: AllowCloudTrailEncrypt
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceOrgID: !Ref OrganizationId
          - Sid: AllowConfigEncrypt
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceOrgID: !Ref OrganizationId
          - Sid: AllowDecryptForLogAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
      Tags:
        - Key: Purpose
          Value: Log Archive Encryption

  LogArchiveKmsAlias:
    Type: AWS::KMS::Alias
    Condition: UseKmsEncryption
    Properties:
      AliasName: !Sub 'alias/${OrgName}-log-archive'
      TargetKeyId: !Ref LogArchiveKmsKey

  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "Access logs destination bucket cannot log to itself without recursive logging loop"
    Properties:
      BucketName: !Sub '${OrgName}-log-archive-access-logs-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          # S3 server access log delivery requires SSE-S3; it cannot write to an SSE-KMS destination bucket.
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Purpose
          Value: S3 Access Logs for Log Archive Buckets

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLSRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowS3Logging
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  OrganizationCloudTrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${OrgName}-org-cloudtrail-logs-${AWS::AccountId}'
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: cloudtrail-access/
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [UseKmsEncryption, 'aws:kms', 'AES256']
              KMSMasterKeyID: !If [UseKmsEncryption, !Ref LogArchiveKmsKey, !Ref 'AWS::NoValue']
            BucketKeyEnabled: !If [UseKmsEncryption, true, false]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldVersionsToGlacier
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER
                TransitionInDays: 90
            NoncurrentVersionExpirationInDays: 365
          - !If
            - HasLogRetention
            - Id: ExpireLogsAfterRetention
              Status: Enabled
              ExpirationInDays: !Ref LogRetentionDays
              NoncurrentVersionExpirationInDays: 7
            - !Ref 'AWS::NoValue'
          - !If
            - HasLogRetention
            - Id: RemoveExpiredDeleteMarkers
              Status: Enabled
              ExpiredObjectDeleteMarker: true
            - !Ref 'AWS::NoValue'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Purpose
          Value: Organization CloudTrail Logs

  OrganizationCloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OrganizationCloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLSRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt OrganizationCloudTrailBucket.Arn
              - !Sub '${OrganizationCloudTrailBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt OrganizationCloudTrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceOrgID: !Ref OrganizationId
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource:
              - !Sub '${OrganizationCloudTrailBucket.Arn}/AWSLogs/${OrganizationId}/*'
              - !Sub '${OrganizationCloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
              - !Sub '${OrganizationCloudTrailBucket.Arn}/AWSLogs/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceOrgID: !Ref OrganizationId

Outputs:
  KmsKeyArn:
    Condition: UseKmsEncryption
    Description: ARN of the Log Archive KMS key
    Value: !GetAtt LogArchiveKmsKey.Arn
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyArn'

  KmsKeyId:
    Condition: UseKmsEncryption
    Description: ID of the Log Archive KMS key
    Value: !Ref LogArchiveKmsKey
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyId'

  AccessLogsBucketName:
    Description: S3 access logs bucket name
    Value: !Ref AccessLogsBucket
    Export:
      Name: !Sub '${AWS::StackName}-AccessLogsBucket'

  CloudTrailBucketName:
    Description: Organization CloudTrail logs S3 bucket name
    Value: !Ref OrganizationCloudTrailBucket
    Export:
      Name: !Sub '${AWS::StackName}-CloudTrailBucketName'

  CloudTrailBucketArn:
    Description: Organization CloudTrail logs S3 bucket ARN
    Value: !GetAtt OrganizationCloudTrailBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CloudTrailBucketArn'
