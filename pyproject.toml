[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tarmac-cli"
version = "0.4.0"
description = "Enterprise AWS Governance & Multi-Account Landing Zone CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nicholas Christian", email = "nicholasdchristian@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Typing :: Typed",
]
keywords = [
    "aws",
    "aws-organizations",
    "landing-zone",
    "governance",
    "cloudformation",
    "iam-identity-center",
    "finops",
    "security",
]
dependencies = [
    "boto3>=1.42.0",
    "botocore>=1.42.0",
    "typer>=0.16.0",
    "rich>=13.8.0",
    "pydantic[email]>=2.8.0",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/nickdchristian/tarmac-cli"
Documentation = "https://github.com/nickdchristian/tarmac-cli#readme"
Repository = "https://github.com/nickdchristian/tarmac-cli.git"
Issues = "https://github.com/nickdchristian/tarmac-cli/issues"

[project.scripts]
tarmac = "tarmac.cli.main:app"
aws-gov = "tarmac.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
    "cfn-lint>=1.20.0",
    "basedpyright>=1.40.2",
    "twine>=6.0.0",
    "boto3-stubs[account,budgets,ce,cloudformation,cloudtrail,ec2,guardduty,iam,identitystore,kms,organizations,s3,securityhub,service-quotas,sns,sso-admin,sts,support]>=1.43.115",
]

[tool.uv]
managed = true
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tarmac" = ["py.typed", "templates/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*__pycache__*", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["tarmac"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "C901", # cyclomatic complexity (ratchet max-complexity down over time)
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # do not perform function calls in argument defaults (standard for typer Option/Argument)
    "B904",   # raise typer.Exit within except blocks
    "RUF001", # allow unicode symbols in rich CLI output
    "S105",   # status enum constants (e.g. PASS = "PASS")
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S506", "PT011"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
