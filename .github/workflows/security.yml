name: Dependency Audit

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/security.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Export locked requirements
        run: uv export --locked --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"

      - name: Audit for known vulnerabilities
        run: uvx --exclude-newer "7 days" pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict
